<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Claude</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Draggable title bar area (for frameless window) -->
  <div id="titlebar">Claude</div>

  <div id="chat">
    <div id="welcome">
      <h1>Claude</h1>
      <p>Powered by the Claude Agent SDK. Uses your Claude Code subscription.</p>
      <p class="hint">Ask me anything — I can read files, write code, search the web, and more.</p>
    </div>
    <div id="messages"></div>
  </div>

  <div id="input-area">
    <form id="form">
      <textarea id="prompt" rows="1" placeholder="Message Claude…" autofocus></textarea>
      <button id="send-btn" type="submit" title="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
      <button id="stop-btn" type="button" title="Stop" class="hidden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"></rect>
        </svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
